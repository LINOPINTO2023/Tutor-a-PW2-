<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 02 - Calculadora</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f3f3f3;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor {
            text-align: center;
        }

        h1 {
            margin-bottom: 15px;
        }

        .calculadora {
            width: 330px;
            padding: 20px;
            background-color: #202020;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        #pantalla {
            width: 100%;
            height: 70px;
            margin-bottom: 15px;
            padding: 10px;

            font-size: 32px;
            text-align: right;

            color: white;
            background-color: #151515;

            border: none;
            border-radius: 5px;
            outline: none;
        }

        .botones {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        button {
            height: 55px;

            border: none;
            border-radius: 5px;

            font-size: 20px;
            color: white;
            background-color: #333333;

            cursor: pointer;
        }

        button:hover {
            background-color: #444444;
        }

        button:active {
            background-color: #555555;
        }

        .operador {
            background-color: #3f3f3f;
        }

        .igual {
            background-color: #0067c0;
        }

        .igual:hover {
            background-color: #0078d4;
        }

        .borrar {
            background-color: #8b0000;
        }

        .borrar:hover {
            background-color: #a00000;
        }

        .pila-contenedor {
            margin-top: 20px;
            width: 330px;

            padding: 15px;

            background-color: white;
            border-radius: 8px;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        .pila-contenedor h2 {
            margin-top: 0;
            font-size: 20px;
        }

        #pila {
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }

        #pila p {
            margin: 5px 0;
            padding: 8px;

            background-color: #eeeeee;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Calculadora</h1>

        <div class="calculadora">

            <input type="text" id="pantalla" readonly>

            <div class="botones">

                <!-- Primera fila -->
                <button onclick="borrar()" class="borrar">C</button>
                <button onclick="agregar('/')" class="operador">÷</button>
                <button onclick="agregar('*')" class="operador">×</button>
                <button onclick="agregar('-')" class="operador">−</button>

                <!-- Segunda fila -->
                <button onclick="agregar('7')">7</button>
                <button onclick="agregar('8')">8</button>
                <button onclick="agregar('9')">9</button>
                <button onclick="agregar('+')" class="operador">+</button>

                <!-- Tercera fila -->
                <button onclick="agregar('4')">4</button>
                <button onclick="agregar('5')">5</button>
                <button onclick="agregar('6')">6</button>
                <button onclick="calcular()" class="igual">=</button>

                <!-- Cuarta fila -->
                <button onclick="agregar('1')">1</button>
                <button onclick="agregar('2')">2</button>
                <button onclick="agregar('3')">3</button>

                <!-- Quinta fila -->
                <button onclick="agregar('0')">0</button>
                <button onclick="agregar('.')">.</button>

            </div>

        </div>

        <div class="pila-contenedor">

            <h2>Pila de operaciones</h2>

            <div id="pila"></div>

        </div>

    </div>

    <script src="script_ejercicio_02.js"></script>

</body>
</html>
```
