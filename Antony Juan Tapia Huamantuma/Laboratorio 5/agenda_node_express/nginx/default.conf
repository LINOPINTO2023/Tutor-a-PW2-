
server {
    listen 80;
    server_name localhost;

    # Página principal de la agenda
    location = / {
        return 302 /lab04/;
    }

    # Interfaz web de la aplicación
    location /lab04/ {
        proxy_pass http://agenda:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API de eventos
    location /api/ {
        proxy_pass http://agenda:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Archivos CSS
    location /css/ {
        proxy_pass http://agenda:3000/css/;
    }

    # Archivos JavaScript
    location /js/ {
        proxy_pass http://agenda:3000/js/;
    }
}