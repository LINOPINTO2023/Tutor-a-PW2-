
services:
  agenda:
    build: .
    container_name: agenda_node
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ./data/events:/app/data/events

  nginx:
    image: nginx:alpine
    container_name: agenda_nginx
    restart: unless-stopped
    ports:
      - "8084:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - agenda